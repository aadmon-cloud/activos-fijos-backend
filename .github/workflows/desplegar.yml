name: Backend - pruebas y despliegue

# Cada push a develop prueba el backend y, si pasa, lo publica en el servidor.
# Tambien se puede lanzar a mano desde la pestana Actions.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Un despliegue a la vez: si llega otro push mientras uno corre, espera.
concurrency:
  group: despliegue-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q

  desplegar:
    needs: pruebas
    # El servidor esta en una red interna: lo alcanza un runner instalado en el propio servidor.
    runs-on: [self-hosted, linux, activos-server]
    steps:
      - uses: actions/checkout@v4

      - name: Dejar listo solo el codigo que corre en el servidor
        run: |
          ENTREGA="$HOME/entrega-backend"
          rm -rf "$ENTREGA" && mkdir -p "$ENTREGA"
          cp -r main.py config modules shared scripts requirements.txt "$ENTREGA"/
          find "$ENTREGA" -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Publicar (con vuelta atras si el servicio no arranca)
        run: sudo /usr/local/sbin/activos-deploy-backend "$HOME/entrega-backend"
